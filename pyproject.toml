[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name        = "limit-order-book"
version     = "0.3.0"
description = "Limit Order Book — Interactive Dashboard & Strategy Research"
readme      = "README.md"
license     = { text = "MIT" }
requires-python = ">=3.10"

authors = [
  { name = "Mohit" },
]

keywords = [
  "algorithmic-trading", "order-book", "dashboard", "plotly-dash",
  "market-microstructure", "backtesting", "quantitative-finance",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "pandas>=2.2",
  "pyarrow>=15",
  "statsmodels>=0.14",
  "plotly>=5.22",
  "dash>=2.17",
  "Flask>=3.0",
  "requests>=2.31",
  "tqdm>=4.66",
]

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
